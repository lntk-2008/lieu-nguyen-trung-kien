<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài thơ Cô Hái Mơ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }
      
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            line-height: 1.6;
            margin: 5px 0;
        }
        .italic {
            font-style: italic;
        }
        .author {
            margin-top: 15px;
        }
        .bold {
            font-weight: bold;
        }
        .underline {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div >
        <h1>CÔ HÁI MƠ</h1>
        
        <p class="italic">Thơ thẩn đường chiều một khách thơ,</p>
        <p class="italic">Say nhìn xa rộng núi xanh lơ,</p>
        <p>Khi trời lặng lẽ và trong trẻo,</p>
        <p>Thấp thoáng rừng mơ, <span class="bold">Cô hái mơ</span>.</p>
        
        <p class="author">Tác giả: <span class="bold underline">Vô danh</span></p>
    </div>

</body>
</html>
