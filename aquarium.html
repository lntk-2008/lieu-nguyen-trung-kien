<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6.1.1 - Hồ Cá Vui Nhộn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            /* Tạo nền nước biển chuyển sắc */
            background: linear-gradient(180deg, #00b4d8 0%, #0077b6 45%, #03045e 100%);
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* Nút quay lại trang chủ */
        .back-home {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.85);
            color: #03045e;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .back-home:hover {
            background: #ffffff;
            transform: scale(1.05);
        }

        /* Định dạng chung cho các sinh vật / thợ lặn */
        .sea-object {
            position: absolute;
            pointer-events: none;
        }

        /* 1. Cá mập */
        #shark {
            width: 240px;
            top: 18%;
            animation: swimShark 18s linear infinite;
        }

        /* 2. Rùa biển */
        #turtle {
            width: 150px;
            top: 55%;
            animation: swimTurtle 26s linear infinite;
        }

        /* 3. Đàn cá vàng */
        #goldfish {
            width: 170px;
            top: 35%;
            animation: swimSchoolRight 20s ease-in-out infinite;
        }

        /* 4. Đàn cá mờ ở xa */
        #faintschool {
            width: 130px;
            top: 22%;
            opacity: 0.7;
            animation: swimSchoolLeft 28s linear infinite;
        }

        /* 5. Thợ lặn 1 */
        #diver1 {
            width: 120px;
            left: 15%;
            animation: diveVertical 9s ease-in-out infinite alternate;
        }

        /* 6. Thợ lặn 2 */
        #diver2 {
            width: 130px;
            right: 20%;
            top: 25%;
            animation: diveFloat 11s ease-in-out infinite alternate;
        }

        /* 7. Thợ lặn 3 */
        #diver3 {
            width: 125px;
            left: 50%;
            bottom: 12%;
            animation: diveHorizontal 14s ease-in-out infinite alternate;
        }

        /* --- KEYFRAMES CHUYỂN ĐỘNG --- */

        /* Cá mập bơi qua lại và lật đầu */
        @keyframes swimShark {
            0%   { left: -260px; transform: scaleX(1); }
            48%  { left: 100vw; transform: scaleX(1); }
            50%  { left: 100vw; transform: scaleX(-1); }
            98%  { left: -260px; transform: scaleX(-1); }
            100% { left: -260px; transform: scaleX(1); }
        }

        /* Rùa biển bơi chậm rãi */
        @keyframes swimTurtle {
            0%   { right: -180px; transform: scaleX(-1) translateY(0); }
            25%  { transform: scaleX(-1) translateY(-20px); }
            48%  { right: 100vw; transform: scaleX(-1) translateY(0); }
            50%  { right: 100vw; transform: scaleX(1) translateY(0); }
            75%  { transform: scaleX(1) translateY(20px); }
            98%  { right: -180px; transform: scaleX(1) translateY(0); }
            100% { right: -180px; transform: scaleX(-1) translateY(0); }
        }

        /* Đàn cá vàng bơi lượn sóng */
        @keyframes swimSchoolRight {
            0%   { left: -200px; transform: translateY(0px) scaleX(1); }
            25%  { transform: translateY(-25px) scaleX(1); }
            49%  { left: 100vw; transform: translateY(15px) scaleX(1); }
            50%  { left: 100vw; transform: translateY(15px) scaleX(-1); }
            75%  { transform: translateY(-20px) scaleX(-1); }
            99%  { left: -200px; transform: translateY(0px) scaleX(-1); }
            100% { left: -200px; transform: translateY(0px) scaleX(1); }
        }

        /* Đàn cá nhỏ bơi nền */
        @keyframes swimSchoolLeft {
            0%   { right: -150px; }
            100% { right: 105vw; }
        }

        /* Thợ lặn lặn lên xuống */
        @keyframes diveVertical {
            0%   { top: 15%; transform: rotate(-5deg); }
            100% { top: 65%; transform: rotate(8deg); }
        }

        /* Thợ lặn lơ lửng */
        @keyframes diveFloat {
            0%   { transform: translate(0, 0) rotate(0deg); }
            50%  { transform: translate(-30px, 40px) rotate(-6deg); }
            100% { transform: translate(20px, -20px) rotate(5deg); }
        }

        /* Thợ lặn di chuyển đáy biển */
        @keyframes diveHorizontal {
            0%   { transform: translateX(-80px) translateY(0); }
            100% { transform: translateX(80px) translateY(-35px); }
        }

        /* Trang trí đáy cát */
        .seabed {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: linear-gradient(180deg, #e9c46a 0%, #d4a373 100%);
            border-top-left-radius: 50% 15px;
            border-top-right-radius: 50% 15px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">&larr; Về Trang Chủ</a>

    <!-- Các sinh vật biển -->
    <img src="images/faintSchool.png" alt="Đàn cá xa" id="faintschool" class="sea-object">
    <img src="images/shark.png" alt="Cá mập" id="shark" class="sea-object">
    <img src="images/goldFishSchool.png" alt="Đàn cá vàng" id="goldfish" class="sea-object">
    <img src="images/turtle.png" alt="Rùa biển" id="turtle" class="sea-object">

    <!-- Các thợ lặn -->
    <img src="images/diver1.png" alt="Thợ lặn 1" id="diver1" class="sea-object">
    <img src="images/diver2.png" alt="Thợ lặn 2" id="diver2" class="sea-object">
    <img src="images/diver3.png" alt="Thợ lặn 3" id="diver3" class="sea-object">

    <div class="seabed"></div>
</body>
</html>
